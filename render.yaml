services:
  - type: web
    name: hostelsense-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hostelsense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: FACE_SERVICE_URL
        sync: false
      - key: FACE_SERVICE_TOKEN
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false

  - type: web
    name: hostelsense-face-service
    runtime: docker
    dockerfilePath: ./face-service/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FACE_SERVICE_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: hostelsense-db
    databaseName: hostelsense
    user: hostelsense

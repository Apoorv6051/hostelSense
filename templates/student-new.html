<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelSense — Add student</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/warden.css') }}" />
</head>
<body>
  <div class="mobile-bar">
    <div class="mobile-brand">
      <div class="logo-mark" style="width:34px;height:34px;border-radius:10px;font-size:0.8rem;">HS</div>
      Add student
    </div>
    <a class="menu-btn" href="/students" aria-label="Back" style="text-decoration:none;">←</a>
  </div>

  <div class="app" style="grid-template-columns: 1fr;">
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1>Add a student</h1>
          <p>Add a resident to the Block C roster</p>
        </div>
        <div class="topbar-right">
          <a class="btn-secondary" href="/students">← Student roster</a>
        </div>
      </header>

      <main class="content" style="align-items: center;">
        <div class="card form-card-wide">
          <a class="back-link" href="/students">← Student roster</a>

          <div id="success" class="success-box hidden" role="status">
            Student added to the Block C roster.
          </div>
          <div id="credentials" class="success-box hidden" role="status"></div>

          <form id="student-form" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="name">Full name</label>
                <input id="name" type="text" placeholder="e.g. Aarav Sharma" required />
              </div>
              <div class="field">
                <label for="roll">Roll number</label>
                <input id="roll" type="text" inputmode="numeric" maxlength="13" placeholder="13-digit roll number" required />
              </div>
              <div class="field">
                <label for="room">Room</label>
                <input id="room" type="text" placeholder="e.g. C-214" required />
              </div>
              <div class="field">
                <label for="floor">Floor</label>
                <select id="floor">
                  <option value="1">Floor 1</option>
                  <option value="2" selected>Floor 2</option>
                  <option value="3">Floor 3</option>
                  <option value="4">Floor 4</option>
                </select>
              </div>
              <div class="field full">
                <label for="course">Course</label>
                <input id="course" type="text" placeholder="e.g. B.Tech CSE · Year 2" required />
              </div>
              <div class="field">
                <label for="parent-name">Parent name</label>
                <input id="parent-name" type="text" placeholder="Optional" />
              </div>
              <div class="field">
                <label for="parent-email">Parent email</label>
                <input id="parent-email" type="email" placeholder="Parent login email" required />
              </div>
              <div class="field">
                <label for="student-password">Student password</label>
                <div style="display:flex;gap:0.5rem;">
                  <input id="student-password" type="password" minlength="12" placeholder="At least 12 characters" required />
                  <button type="button" class="btn-secondary password-toggle" data-target="student-password">Show</button>
                </div>
              </div>
              <div class="field">
                <label for="parent-password">Parent password</label>
                <div style="display:flex;gap:0.5rem;">
                  <input id="parent-password" type="password" minlength="12" placeholder="At least 12 characters" required />
                  <button type="button" class="btn-secondary password-toggle" data-target="parent-password">Show</button>
                </div>
              </div>
            </div>

            <div class="field full" style="margin: 1rem 0 0;">
              <label>Current status</label>
              <div class="type-pills" role="radiogroup" aria-label="Current status" style="grid-template-columns: 1fr 1fr;">
                <button type="button" class="type-pill active" data-status="inside" aria-pressed="true">
                  <span aria-hidden="true">🏠</span>
                  Inside hostel
                </button>
                <button type="button" class="type-pill" data-status="out" aria-pressed="false">
                  <span aria-hidden="true">🚶</span>
                  Currently out
                </button>
              </div>
            </div>

            <div id="error" class="error-box hidden" role="alert"></div>

            <div class="form-actions">
              <button type="submit" class="btn-primary" id="submit-btn">Add student →</button>
              <a class="btn-secondary" href="/students">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/store.js') }}"></script>
  <script>
    let status = "inside";
    const credentialsBox = document.getElementById("credentials");

    document.querySelectorAll(".password-toggle").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const visible = input.type === "text";
        input.type = visible ? "password" : "text";
        button.textContent = visible ? "Show" : "Hide";
        button.setAttribute("aria-label", `${visible ? "Show" : "Hide"} password`);
      });
    });

    document.querySelectorAll(".type-pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        status = btn.dataset.status;
        document.querySelectorAll(".type-pill").forEach((b) => {
          const on = b === btn;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
      });
    });

    const rollInput = document.getElementById("roll");
    rollInput.addEventListener("input", () => {
      rollInput.value = rollInput.value.replace(/\D/g, "").slice(0, 13);
    });

    document.getElementById("student-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("error");
      const successBox = document.getElementById("success");
      errorBox.classList.add("hidden");
      successBox.classList.add("hidden");
      credentialsBox.classList.add("hidden");

      const name = document.getElementById("name").value.trim();
      const roll = rollInput.value.trim();
      const room = document.getElementById("room").value.trim();
      const course = document.getElementById("course").value.trim();
      const parentName = document.getElementById("parent-name").value.trim();
      const parentEmail = document.getElementById("parent-email").value.trim();

      const studentPassword = document.getElementById("student-password").value;
      const parentPassword = document.getElementById("parent-password").value;

      if (!name || !roll || !room || !course || !parentName || !parentEmail || !studentPassword || !parentPassword) {
        errorBox.textContent = "Please fill all student, parent, and password fields.";
        errorBox.classList.remove("hidden");
        return;
      }
      if (roll.length < 8) {
        errorBox.textContent = "Roll number looks too short.";
        errorBox.classList.remove("hidden");
        return;
      }

      if (studentPassword.length < 12 || parentPassword.length < 12) {
        errorBox.textContent = "Both passwords must contain at least 12 characters.";
        errorBox.classList.remove("hidden");
        return;
      }

      const response = await fetch("/api/warden/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          studentName: name,
          roll,
          studentPassword,
          parentName,
          parentEmail,
          parentPassword,
          room,
          floor: Number(document.getElementById("floor").value) || 2,
          course,
          status,
        }),
      });
      const accountResult = await response.json();
      if (!response.ok) {
        errorBox.textContent = accountResult.error || "Could not create the accounts.";
        errorBox.classList.remove("hidden");
        return;
      }

      addStudent(accountResult.roster);

      successBox.classList.remove("hidden");
      credentialsBox.innerHTML =
        `<strong>Temporary credentials — copy them now</strong><br>` +
        `Student login: <strong>${escapeHtml(roll)}</strong> · Password: <strong>${escapeHtml(studentPassword)}</strong><br>` +
        `Parent login: <strong>${escapeHtml(parentEmail)}</strong> · Password: <strong>${escapeHtml(parentPassword)}</strong><br>` +
        `<small>These passwords are shown only on this page and are not stored in readable form.</small>`;
      credentialsBox.classList.remove("hidden");
      document.getElementById("submit-btn").textContent = "Added ✓";
      document.getElementById("submit-btn").disabled = true;
      setTimeout(() => {
        window.location.href = "/students";
      }, 10000);
    });
  </script>
</body>
</html>

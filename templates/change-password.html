<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelSense — Change password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}" />
</head>
<body>
  <div class="app" style="grid-template-columns: 1fr;">
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1>Change password</h1>
          <p>Replace the temporary password provided by your warden.</p>
        </div>
        <div class="topbar-right">
          <a class="btn-secondary" href="/{{ user_role }}">Back to portal</a>
        </div>
      </header>
      <main class="content" style="align-items:center;">
        <div class="card form-card-wide">
          <form id="password-form" novalidate>
            <div class="form-grid">
              <div class="field full">
                <label for="current-password">Current password</label>
                <input id="current-password" type="password" required />
              </div>
              <div class="field">
                <label for="new-password">New password</label>
                <input id="new-password" type="password" minlength="12" required />
              </div>
              <div class="field">
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" type="password" minlength="12" required />
              </div>
            </div>
            <div id="message" class="error-box hidden" role="alert"></div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Update password</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script>
    const form = document.getElementById("password-form");
    const message = document.getElementById("message");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.classList.add("hidden");
      const newPassword = document.getElementById("new-password").value;
      if (newPassword !== document.getElementById("confirm-password").value) {
        message.textContent = "The new passwords do not match.";
        message.classList.remove("hidden");
        return;
      }
      const response = await fetch("/api/auth/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          currentPassword: document.getElementById("current-password").value,
          newPassword,
        }),
      });
      const result = await response.json();
      message.textContent = response.ok
        ? "Password updated successfully."
        : (result.error || "Could not update password.");
      message.classList.toggle("error-box", !response.ok);
      message.classList.toggle("success-box", response.ok);
      message.classList.remove("hidden");
      if (response.ok) form.reset();
    });
  </script>
</body>
</html>

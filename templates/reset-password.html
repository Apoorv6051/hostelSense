<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostelSense — Reset password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>
  <main class="login-page">
    <section class="form-panel">
      <div class="form-card">
        <header class="form-header">
          <h2>Set a new password</h2>
          <p>Choose a password with at least 12 characters.</p>
        </header>
        <form id="reset-form" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="confirmation">Confirm password</label>
            <input id="confirmation" name="confirmation" type="password" minlength="12" autocomplete="new-password" required />
          </div>
          <div id="error" class="error-box hidden" role="alert"></div>
          <div id="success" class="error-box hidden" role="status"></div>
          <button type="submit" class="btn-submit">
            <span class="btn-text">Update password</span>
            <span class="btn-arrow" aria-hidden="true">→</span>
          </button>
        </form>
        <p class="form-footnote"><a href="/">← Back to sign in</a></p>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById("reset-form");
    const errorBox = document.getElementById("error");
    const successBox = document.getElementById("success");
    const token = new URLSearchParams(window.location.search).get("token") || "";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.add("hidden");
      successBox.classList.add("hidden");
      const password = document.getElementById("password").value;
      const confirmation = document.getElementById("confirmation").value;
      if (password.length < 12 || password !== confirmation) {
        errorBox.textContent = password.length < 12
          ? "Password must contain at least 12 characters."
          : "Passwords do not match.";
        errorBox.classList.remove("hidden");
        return;
      }
      const response = await fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password }),
      });
      const result = await response.json();
      if (!response.ok) {
        errorBox.textContent = result.error || "Unable to update password.";
        errorBox.classList.remove("hidden");
        return;
      }
      successBox.textContent = result.message;
      successBox.classList.remove("hidden");
      form.querySelector("button").disabled = true;
    });
  </script>
</body>
</html>
